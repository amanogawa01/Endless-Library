<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Endless Library</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <div id="page">

        <header>
            <h1>Endless Library</h1>

            <p>
                A library containing every possible book.
            </p>
        </header>

        <main>

            <section id="library">

                <div id="room-header">

                    <h2 id="room-name">
                        Hexagon 000000
                    </h2>

                    <p>
                        Room 000000
                    </p>

                    <div id="room-navigation">

                        <button id="previous-room" type="button">
                            Previous Room
                        </button>

                        <button id="next-room" type="button">
                            Next Room
                        </button>

                    </div>

                </div>

                <div id="room"></div>

            </section>

        </main>

        <footer>
            <p>Endless Library</p>
        </footer>

        <div id="book-viewer" class="hidden">

            <div id="book">

                <button id="close-book" type="button">
                    Close Book
                </button>

                <h2 id="book-title">
                    Book
                </h2>

                <p id="book-address">
                    Address
                </p>

                <div id="book-text">
                    <p>
                        This book has not been generated yet.
                    </p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
