<title>Endless Library</title>

<link rel="stylesheet" href="style.css">

<body>

    <header>
        <h1>Endless Library</h1>

        </p>

    <main>

        <section id="library">

            <div id="room-header">

                <h2>Hexagon 000000</h2>

                <p>
                    Room 000000

            </div>

            <div id="room">

                <div class="wall">

                    <h3>Wall 1</h3>

                    <div class="shelf"></div>

                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Endless Library</p>
    </footer>

</div>

</body>
</html>
